packages:
  - block
  - kind
  - model
  - test
  - ui
  - workflow

catalog:
  "@milaboratories/ts-builder": 1.7.2
  "@milaboratories/ts-configs": 1.4.0
  "@platforma-sdk/workflow-tengo": 6.16.0
  "@platforma-sdk/block-tools": 2.17.6
  "@platforma-sdk/model": 1.85.2
  "@platforma-sdk/ui-vue": 1.85.2
  "@platforma-sdk/test": 1.85.3
  "@platforma-sdk/tengo-builder": 4.1.18
  "@platforma-sdk/package-builder": 3.16.1
  "@platforma-sdk/blocks-deps-updater": 2.2.0

  "@platforma-open/milaboratories.runenv-python-3": 1.7.8
  "@platforma-open/milaboratories.software-mitool": 2.3.1-174-main

  "turbo": ~2.11.10

  "shx": 0.4.0
  "@changesets/cli": 2.29.8

  '@vueuse/core': ^13.6.0
  'ag-grid-enterprise': &ag-grid ~34.1.2
  'ag-grid-vue3': *ag-grid
  "@platforma-sdk/block-kind": 1.1.0
  vue: 3.5.24
  "@milaboratories/helpers": 1.14.5
  vitest: ~4.0.18
  typescript: ~5.9.3
  "es-toolkit": 1.52.0

  # other blocks used in tests
  "@platforma-open/milaboratories.samples-and-data": 1.24.0
minimumReleaseAgeExclude:
  - "@milaboratories/*"
  - "@platforma-sdk/*"
  - "@platforma-open/*"
allowBuilds:
  # Its postinstall unpacks a MiTool archive in MiTool's own CI only.
  "@platforma-open/milaboratories.software-mitool": false
  "@milaboratories/tengo-tester": false
  cpu-features: false
  esbuild: false
  protobufjs: false
  ssh2: false
  "@milaboratories/pframes-rs-node": true
